<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F40000">
<title>Seguimiento personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --marca: "Montserrat", "Gotham", "Helvetica Neue", Arial, sans-serif;
  --rojo: #F40000; --rojo-osc: #C40000; --negro: #000; --blanco: #FFF;
  --gris-marca: #C8C8C8; --gris-1: #F4F4F4; --gris-2: #E6E6E6; --gris-3: #8C8C8C;
  --tinta: #000; --tinta2: #4D4D4D; --tinta3: #6E6E6E; --rejilla: #ECECEC;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 62px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; font-family: var(--marca); background: var(--blanco); color: var(--tinta); }
h1, h2, h3, p, figure { margin: 0; }
:focus-visible { outline: 3px solid var(--negro); outline-offset: 2px; }
a { color: var(--negro); }
a:hover { color: var(--rojo-osc); }

.acceso { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.ia-panel { position: relative; display: flex; flex-direction: column; min-width: 0; }
.ia-blanco { background: var(--blanco); }
.ia-rojo { background: var(--rojo); color: var(--blanco); }
.ia-contenido { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: clamp(72px, 9vw, 120px) clamp(24px, 6vw, 88px) 32px; }
.ia-kicker { font-size: 12px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--tinta2); }
.ia-titulo { font-size: clamp(44px, 6.6vw, 88px); font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.ia-raya { display: block; width: 72px; height: 6px; background: var(--rojo); }
.ia-texto { font-size: 16px; line-height: 1.55; color: #1a1a1a; max-width: 440px; }
.ia-pie { margin: 0 clamp(24px, 6vw, 88px) 26px; padding-top: 10px; border-top: 1px solid var(--gris-3); font-size: 10.5px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: var(--tinta2); }
.ia-rojo .ia-pie { border-color: rgba(255,255,255,.75); color: var(--blanco); text-align: right; }
.ia-form { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 520px; padding: clamp(64px, 8vw, 112px) clamp(24px, 6vw, 88px) 32px; }
.ia-form-kicker { font-size: 12px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; margin-bottom: 18px; }
.ia-etiqueta { display: block; font-size: 14px; font-weight: 700; margin: 12px 0 6px; }
.ia-input { width: 100%; min-height: 48px; padding: 12px 14px; font-family: inherit; font-size: 16px; letter-spacing: .06em; color: var(--negro); background: var(--blanco); border: 2px solid var(--blanco); border-radius: 0; }
.ia-input::placeholder { color: var(--tinta3); }
.ia-input:focus { outline: 3px solid var(--negro); outline-offset: 0; }
.ia-mostrar { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; cursor: pointer; }
.ia-estado { min-height: 1.5em; margin: 12px 0 4px; font-weight: 700; font-size: 14px; line-height: 1.45; }
.ia-estado.error { background: var(--blanco); color: var(--rojo-osc); padding: 6px 10px; }
.ia-boton { align-self: flex-start; min-height: 48px; padding: 12px 28px; margin-top: 6px; font-family: inherit; font-size: 14px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--rojo); background: var(--blanco); border: 2px solid var(--blanco); cursor: pointer; }
.ia-boton:hover:not(:disabled) { background: var(--negro); border-color: var(--negro); color: var(--blanco); }
.ia-boton:focus-visible { outline: 3px solid var(--negro); outline-offset: 3px; }
.ia-boton:disabled { opacity: .6; cursor: progress; }
.ia-ayuda { margin-top: 22px; font-size: 12.5px; line-height: 1.5; opacity: .95; }
@media (max-width: 820px) {
  .acceso { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .ia-contenido { flex: none; padding: 64px 20px 24px; gap: 14px; }
  .ia-form { justify-content: flex-start; padding: 52px 20px 28px; }
  .ia-pie { margin: 0 20px 20px; }
  .ia-blanco .ia-pie { display: none; }
}
#contenido:focus { outline: none; }

.cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;
  padding: 28px clamp(16px, 4vw, 48px) 18px; border-top: 8px solid var(--rojo); }
.kicker { font-size: 11.5px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--tinta2); }
.cab h1 { font-size: clamp(30px, 4.4vw, 48px); font-weight: 800; letter-spacing: -.015em; color: var(--rojo); margin: 6px 0; line-height: 1.05; }
.cab-sub { font-size: 13px; color: var(--tinta2); line-height: 1.5; }
.cab-sub b { color: var(--negro); }

.pestanas { position: sticky; top: 0; z-index: 900; display: flex; gap: 4px; overflow-x: auto;
  padding: 0 clamp(16px, 4vw, 48px); background: var(--blanco); border-bottom: 1px solid var(--gris-marca); }
.pestanas a { flex: none; padding: 14px 16px 12px; font-size: 12.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  text-decoration: none; color: var(--tinta2); border-bottom: 4px solid transparent; }
.pestanas a:hover { color: var(--negro); }
.pestanas a.activa { color: var(--rojo); border-bottom-color: var(--rojo); }

main { max-width: 1280px; margin: 0 auto; padding: 22px clamp(16px, 4vw, 48px) 40px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 178px), 1fr)); gap: 12px; }
.kpi { border-top: 4px solid var(--negro); background: var(--gris-1); padding: 14px 16px 16px; min-width: 0; }
.kpi.destacado { border-top-color: var(--rojo); background: var(--rojo); color: var(--blanco); }
.kpi.destacado .kpi-etq, .kpi.destacado .kpi-sub { color: var(--blanco); }
.kpi-etq { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--tinta2); }
.kpi-val { display: block; margin: 7px 0 4px; font-size: clamp(24px, 2.3vw, 30px); font-weight: 800; line-height: 1.08; }
.kpi-val small { font-size: .5em; font-weight: 700; white-space: nowrap; }
.kpi-sub { font-size: 12.5px; line-height: 1.45; color: var(--tinta2); }

section { margin-top: 38px; }
section:first-child { margin-top: 0; }
.sec-cab { display: flex; gap: 14px; align-items: flex-start; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--gris-marca); }
.sec-cab::before { content: ''; flex: none; width: 6px; height: 26px; margin-top: 2px; background: var(--rojo); }
.sec-cab h2 { font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
.sec-cab p { font-size: 13.5px; color: var(--tinta2); margin-top: 4px; line-height: 1.5; max-width: 900px; }
h3.sub { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta2); margin: 22px 0 8px; }
.texto { font-size: 14.5px; line-height: 1.6; max-width: 900px; margin-bottom: 12px; }
.dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap: 28px; }
.dos > * { min-width: 0; }

.aviso { border-left: 6px solid var(--rojo); background: var(--gris-1); padding: 12px 16px; font-size: 13.5px; line-height: 1.55; margin-bottom: 10px; max-width: 900px; }

.grafica { width: 100%; min-height: 60px; touch-action: pan-y; }
.grafica svg { display: block; overflow: visible; font-family: var(--marca); }
.grafica svg:focus { outline: none; }
.grafica svg:focus .zona-foco { stroke: var(--negro); }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--tinta2); margin: 2px 0 10px; }
.ley { display: inline-flex; align-items: center; gap: 7px; }
.ley i { display: inline-block; flex: none; }
.ley .l-linea { width: 22px; height: 0; border-top: 2px solid; }
.ley .l-guion { width: 22px; height: 0; border-top: 2px dashed; }
.ley .l-punto { width: 10px; height: 10px; border-radius: 50%; }
.ley .l-banda { width: 18px; height: 11px; }
details.tabla { margin-top: 10px; font-size: 13px; }
details.tabla summary { cursor: pointer; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta2); padding: 6px 0; }
.tabla-env { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
caption { text-align: left; font-size: 12.5px; color: var(--tinta2); padding-bottom: 8px; line-height: 1.45; }
th { text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--blanco); background: var(--negro); padding: 8px 10px; white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--gris-2); vertical-align: top; line-height: 1.45; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.resaltada td { font-weight: 700; }

.ecuaciones { display: grid; gap: 4px; }
.ecuacion { padding: 12px 0; border-bottom: 1px solid var(--gris-2); }
.ecuacion .formula { overflow-x: auto; padding-bottom: 4px; }
.ecuacion svg { display: block; max-width: none; height: auto; }
.ecuacion p { font-size: 13px; color: var(--tinta2); line-height: 1.5; margin-top: 4px; }
.refs { font-size: 12.5px; line-height: 1.5; padding-left: 26px; max-width: 980px; }
.refs li { margin-bottom: 6px; overflow-wrap: anywhere; }

.tooltip { position: fixed; z-index: 1000; pointer-events: none; background: var(--blanco); border: 1px solid var(--negro);
  padding: 8px 10px; font-size: 12px; line-height: 1.4; max-width: 280px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.tt-tit { font-size: 11px; font-weight: 700; color: var(--tinta2); margin-bottom: 4px; }
.tt-fila { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tt-fila i { display: inline-block; flex: none; width: 14px; border-top: 2px solid; }
.tt-fila b { font-weight: 800; font-variant-numeric: tabular-nums; }
.tt-fila span { color: var(--tinta2); overflow: hidden; text-overflow: ellipsis; }

.pie { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 8px clamp(16px, 4vw, 48px) 26px; padding-top: 10px;
  border-top: 1px solid var(--gris-3); font-size: 10.5px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--tinta2); }
@media print { .pestanas, details.tabla summary { display: none; } }
</style>
</head>
<body>
<section id="acceso" class="acceso" aria-labelledby="acceso-titulo">
  <div class="ia-panel ia-blanco">
    <div class="ia-contenido">
      <p class="ia-kicker">Seguimiento individual</p>
      <h1 class="ia-titulo" id="acceso-titulo">Gestión<br>de peso.</h1>
      <span class="ia-raya" aria-hidden="true"></span>
      <p class="ia-texto">Esta página está cifrada. Su contenido solo se abre en tu navegador, con la contraseña correcta.</p>
    </div>
    <p class="ia-pie"><span>Uso personal</span></p>
  </div>
  <div class="ia-panel ia-rojo">
    <form class="ia-form" id="form-acceso" autocomplete="off" novalidate>
      <p class="ia-form-kicker">Acceso</p>
      <label class="ia-etiqueta" for="contrasena">Contraseña</label>
      <input class="ia-input" id="contrasena" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX">
      <label class="ia-mostrar"><input type="checkbox" id="mostrar"> Mostrar contraseña</label>
      <p class="ia-estado" id="estado-acceso" role="status" aria-live="polite"></p>
      <button class="ia-boton" id="entrar" type="submit">Entrar <span aria-hidden="true">→</span></button>
      <p class="ia-ayuda">Cada publicación genera una contraseña nueva. Usa la del último mensaje del bot.</p>
    </form>
    <p class="ia-pie"><span>Cifrado AES-256</span></p>
  </div>
</section>
<div id="contenido" tabindex="-1" hidden></div>

<script>
function mostrarReporte(D) {
  'use strict';
  var SVGNS = 'http://www.w3.org/2000/svg';
  var INICIO = new Date(D.inicio + 'T12:00:00');
  var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var tip = document.getElementById('tooltip');

  function nodo(nombre, atributos, padre) {
    var e = document.createElementNS(SVGNS, nombre);
    for (var k in atributos) e.setAttribute(k, atributos[k]);
    if (padre) padre.appendChild(e);
    return e;
  }
  function fechaDe(dia, conAnio) {
    var f = new Date(INICIO.getTime());
    f.setDate(f.getDate() + Math.round(dia));
    return f.getDate() + ' ' + MESES[f.getMonth()] + (conAnio ? ' ' + f.getFullYear() : '');
  }
  function numero(v, dec) { return v.toFixed(dec).replace('-', '−'); }
  function pasoLindo(rango, n) {
    var bruto = rango / Math.max(n, 1);
    var base = Math.pow(10, Math.floor(Math.log10(bruto)));
    var f = bruto / base;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * base;
  }
  function interpolar(xs, ys, x) {
    if (!ys.length || x < xs[0] || x > xs[ys.length - 1]) return null;
    var a = 0, b = ys.length - 1;
    while (b - a > 1) { var m = (a + b) >> 1; if (xs[m] <= x) a = m; else b = m; }
    if (xs[b] === xs[a]) return ys[a];
    return ys[a] + (ys[b] - ys[a]) * (x - xs[a]) / (xs[b] - xs[a]);
  }
  function camino(xs, ys, fx, fy) {
    var d = '';
    for (var i = 0; i < ys.length; i++) d += (i ? 'L' : 'M') + fx(xs[i]).toFixed(1) + ' ' + fy(ys[i]).toFixed(1);
    return d;
  }

  function grafica(id, cfg) {
    var raiz = document.getElementById(id);
    if (!raiz) return;
    var leyenda = document.createElement('div');
    leyenda.className = 'leyenda';
    (cfg.series || []).concat(cfg.bandas || []).forEach(function (s) {
      if (!s.nombre || s.sinLeyenda) return;
      var item = document.createElement('span');
      item.className = 'ley';
      var clave = document.createElement('i');
      if (s.lo) { clave.className = 'l-banda'; clave.style.background = s.color; clave.style.opacity = Math.min(1, s.opacidad * 1.6); }
      else if (s.puntos) { clave.className = 'l-punto'; clave.style.background = s.color; }
      else if (s.corte !== undefined || s.guion) { clave.className = 'l-guion'; clave.style.borderColor = s.color; }
      else { clave.className = 'l-linea'; clave.style.borderColor = s.color; }
      item.appendChild(clave);
      item.appendChild(document.createTextNode(s.nombre));
      leyenda.appendChild(item);
    });
    raiz.appendChild(leyenda);
    var lienzo = document.createElement('div');
    raiz.appendChild(lienzo);
    var detalle = document.createElement('details');
    detalle.className = 'tabla';
    var resumen = document.createElement('summary');
    resumen.textContent = 'Ver como tabla';
    detalle.appendChild(resumen);
    detalle.addEventListener('toggle', function () { if (detalle.open && detalle.children.length === 1) detalle.appendChild(tablaDe(cfg)); });
    raiz.appendChild(detalle);

    function dibujar() {
      lienzo.textContent = '';
      var W = Math.max(280, lienzo.clientWidth || raiz.clientWidth);
      var H = W < 560 ? (cfg.altoMovil || 280) : (cfg.alto || 380);
      var mi = 50, md = (cfg.etiquetasFinales && W >= 560) ? 118 : 14, ma = 10, mb = 30;
      var xMax = cfg.xMax;
      var fx = function (x) { return mi + x / xMax * (W - mi - md); };
      var todos = [];
      (cfg.series || []).forEach(function (s) { s.y.forEach(function (v, i) { if (s.x[i] <= xMax) todos.push(v); }); });
      (cfg.bandas || []).forEach(function (b) { b.lo.forEach(function (v, i) { if (b.x[i] <= xMax) { todos.push(v); todos.push(b.hi[i]); } }); });
      (cfg.refs || []).forEach(function (r) { todos.push(r.y); });
      var yMin = Math.min.apply(null, todos), yMax = Math.max.apply(null, todos);
      var holgura = Math.max((yMax - yMin) * 0.08, cfg.holguraMin || 0.5);
      yMin -= holgura * (cfg.espacioAbajo || 1); yMax += holgura;
      if (cfg.simetrico) { var t = Math.max(Math.abs(yMin), Math.abs(yMax)); yMin = -t; yMax = t; }
      var fy = function (y) { return ma + (yMax - y) / (yMax - yMin) * (H - ma - mb); };
      var svg = nodo('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', tabindex: 0, 'aria-label': cfg.descripcion }, lienzo);

      var pasoY = pasoLindo(yMax - yMin, H < 300 ? 4 : 6), dec = pasoY < 1 ? 1 : 0;
      for (var v = Math.ceil(yMin / pasoY) * pasoY; v <= yMax + 1e-9; v += pasoY) {
        nodo('line', { x1: mi, x2: W - md, y1: fy(v), y2: fy(v), stroke: '#ECECEC', 'stroke-width': 1 }, svg);
        var ty = nodo('text', { x: mi - 7, y: fy(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#6E6E6E' }, svg);
        ty.textContent = cfg.miles ? Math.round(v).toLocaleString('es-MX') : numero(Math.abs(v) < 1e-9 ? 0 : v, dec);
      }
      var tick = [14, 28, 56, 91, 182, 364].filter(function (p) { return xMax / p * (p >= 91 ? 96 : 62) <= W - mi - md; })[0] || 364;
      for (var x = 0; x <= xMax + 1e-9; x += tick) {
        nodo('line', { x1: fx(x), x2: fx(x), y1: H - mb, y2: H - mb + 4, stroke: '#8C8C8C', 'stroke-width': 1 }, svg);
        var tx = nodo('text', { x: fx(x), y: H - mb + 17, 'text-anchor': x === 0 ? 'start' : 'middle', 'font-size': 11, fill: '#6E6E6E' }, svg);
        tx.textContent = fechaDe(x, tick >= 91);
      }
      nodo('line', { x1: mi, x2: W - md, y1: H - mb, y2: H - mb, stroke: '#8C8C8C', 'stroke-width': 1 }, svg);

      (cfg.bandas || []).forEach(function (b) {
        var d = camino(b.x, b.hi, fx, fy);
        for (var i = b.lo.length - 1; i >= 0; i--) d += 'L' + fx(b.x[i]).toFixed(1) + ' ' + fy(b.lo[i]).toFixed(1);
        nodo('path', { d: d + 'Z', fill: b.color, 'fill-opacity': b.opacidad, stroke: 'none' }, svg);
      });
      (cfg.refs || []).forEach(function (r) {
        nodo('line', { x1: mi, x2: W - md, y1: fy(r.y), y2: fy(r.y), stroke: r.color || '#6E6E6E', 'stroke-width': 1 }, svg);
        if (r.texto) {
          var t = nodo('text', { x: mi + 6, y: fy(r.y) - 5, 'font-size': 11, 'font-weight': 700, fill: '#000' }, svg);
          t.textContent = r.texto;
        }
      });
      (cfg.series || []).forEach(function (s) {
        if (s.puntos) {
          s.y.forEach(function (v, i) {
            if (s.tallos) nodo('line', { x1: fx(s.x[i]), x2: fx(s.x[i]), y1: fy(0), y2: fy(v), stroke: s.color, 'stroke-width': 1.5 }, svg);
          });
          s.y.forEach(function (v, i) {
            nodo('circle', { cx: fx(s.x[i]), cy: fy(v), r: 4.5, fill: s.color, stroke: '#FFF', 'stroke-width': 2 }, svg);
          });
          return;
        }
        var fin = s.y.length;
        if (s.corte !== undefined) {
          var k = 0;
          while (k < fin && s.x[k] < s.corte) k++;
          nodo('path', { d: camino(s.x.slice(0, k + 1), s.y.slice(0, k + 1), fx, fy), fill: 'none', stroke: s.color, 'stroke-width': s.ancho || 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
          if (k < fin) nodo('path', { d: camino(s.x.slice(k), s.y.slice(k), fx, fy), fill: 'none', stroke: s.color, 'stroke-width': s.ancho || 2, 'stroke-dasharray': '7 5', 'stroke-linecap': 'round' }, svg);
        } else {
          var a = { d: camino(s.x, s.y, fx, fy), fill: 'none', stroke: s.color, 'stroke-width': s.ancho || 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
          if (s.guion) a['stroke-dasharray'] = '7 5';
          nodo('path', a, svg);
        }
      });
      // Etiquetas directas al final, con línea guía si hay que separarlas.
      if (cfg.etiquetasFinales && W >= 560) {
        var finales = cfg.series.filter(function (s) { return !s.puntos; }).map(function (s) {
          var v = s.y[s.y.length - 1];
          return { s: s, y: fy(v), real: fy(v), x: fx(s.x[s.y.length - 1]) };
        }).sort(function (a, b) { return a.y - b.y; });
        for (var i = 1; i < finales.length; i++) if (finales[i].y - finales[i - 1].y < 15) finales[i].y = finales[i - 1].y + 15;
        var sobra = finales[finales.length - 1].y - (H - mb - 2);
        if (sobra > 0) finales.forEach(function (e) { e.y -= sobra; });
        finales.forEach(function (e) {
          nodo('line', { x1: e.x + 2, y1: e.real, x2: W - md + 6, y2: e.y, stroke: '#8C8C8C', 'stroke-width': .75 }, svg);
          var et = nodo('text', { x: W - md + 9, y: e.y + 4, 'font-size': 11, fill: '#000' }, svg);
          et.textContent = e.s.corto || e.s.nombre;
        });
      }
      // Marcas de llegada: la etiqueta se omite si no cabe; el dato sigue en KPI y tabla.
      var ocupado = [];
      var puntosMarca = (cfg.marcas || []).map(function (m) { return fx(m.x); });
      (cfg.marcas || []).forEach(function (m) {
        nodo('circle', { cx: fx(m.x), cy: fy(m.y), r: 5, fill: m.color, stroke: '#FFF', 'stroke-width': 2 }, svg);
        var izq = fx(m.x) - mi > (W - mi - md) * 0.34;
        var t = nodo('text', { x: fx(m.x) + (izq ? -8 : 8), y: fy(m.y) + 17, 'text-anchor': izq ? 'end' : 'start', 'font-size': 11, 'font-weight': 700, fill: '#000' }, svg);
        t.textContent = m.texto;
        var c = t.getBBox();
        var choca = ocupado.some(function (o) { return c.x < o.x + o.width + 6 && o.x < c.x + c.width + 6; });
        if (!choca) { ocupado.push(c); return; }
        // Arriba de la línea no debe tapar otra marca; si no cabe se omite (sigue en KPI y tabla).
        t.setAttribute('y', fy(m.y) - 9);
        c = t.getBBox();
        var tapa = puntosMarca.some(function (x) { return x !== fx(m.x) && x > c.x - 6 && x < c.x + c.width + 6; });
        if (tapa || c.y < ma) t.remove();
      });

      var cruz = nodo('line', { y1: ma, y2: H - mb, stroke: '#000', 'stroke-width': 1, visibility: 'hidden' }, svg);
      var zona = nodo('rect', { class: 'zona-foco', x: mi, y: ma, width: W - mi - md, height: H - ma - mb, fill: 'transparent', 'stroke-width': 0 }, svg);
      var diaActual = 0;
      function mostrar(dia, px, py) {
        dia = Math.max(0, Math.min(xMax, dia));
        diaActual = dia;
        // Si hay un pesaje cerca, se ancla a él para poder leerlo exacto.
        (cfg.series || []).forEach(function (s) {
          if (!s.puntos) return;
          var margen = 12 / ((W - mi - md) / xMax);
          s.x.forEach(function (xp) { if (Math.abs(xp - dia) <= margen) dia = xp; });
        });
        cruz.setAttribute('x1', fx(dia)); cruz.setAttribute('x2', fx(dia)); cruz.setAttribute('visibility', 'visible');
        tip.textContent = '';
        var tit = document.createElement('div');
        tit.className = 'tt-tit';
        tit.textContent = fechaDe(dia, true) + ' · semana ' + (dia / 7).toFixed(1);
        tip.appendChild(tit);
        (cfg.series || []).forEach(function (s) {
          var v = null;
          if (s.puntos) { var i = s.x.indexOf(dia); if (i >= 0) v = s.y[i]; }
          else v = interpolar(s.x, s.y, dia);
          if (v === null) return;
          var f = document.createElement('div');
          f.className = 'tt-fila';
          var cl = document.createElement('i'); cl.style.borderColor = s.color;
          var val = document.createElement('b');
          val.textContent = (cfg.miles ? Math.round(v).toLocaleString('es-MX') : (cfg.signo && v > 0 ? '+' : '') + numero(v, cfg.decimales === undefined ? 1 : cfg.decimales)) + ' ' + (cfg.unidad || '');
          var nom = document.createElement('span'); nom.textContent = s.corto || s.nombre;
          f.appendChild(cl); f.appendChild(val); f.appendChild(nom);
          tip.appendChild(f);
        });
        tip.hidden = false;
        var r = tip.getBoundingClientRect();
        var cajaSvg = svg.getBoundingClientRect();
        var xPant = px !== undefined ? px : cajaSvg.left + fx(dia);
        var yPant = py !== undefined ? py : cajaSvg.top + 30;
        var izq = xPant + 14 + r.width > window.innerWidth - 8 ? xPant - r.width - 14 : xPant + 14;
        tip.style.left = Math.max(8, izq) + 'px';
        tip.style.top = Math.max(8, Math.min(window.innerHeight - r.height - 8, yPant - r.height / 2)) + 'px';
      }
      function ocultar() { tip.hidden = true; cruz.setAttribute('visibility', 'hidden'); }
      zona.addEventListener('pointermove', function (e) {
        var c = svg.getBoundingClientRect();
        mostrar((e.clientX - c.left - mi) / (W - mi - md) * xMax, e.clientX, e.clientY);
      });
      zona.addEventListener('pointerleave', ocultar);
      svg.addEventListener('focus', function () { mostrar(diaActual); });
      svg.addEventListener('blur', ocultar);
      svg.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); mostrar(diaActual + 7); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); mostrar(diaActual - 7); }
        else if (e.key === 'Escape') { ocultar(); }
      });
    }
    dibujar();
    var ancho = lienzo.clientWidth;
    if (window.ResizeObserver) {
      new ResizeObserver(function () {
        if (lienzo.clientWidth !== ancho) { ancho = lienzo.clientWidth; tip.hidden = true; dibujar(); }
      }).observe(lienzo);
    }
  }

  // Versión en tabla de cada gráfica: la gráfica nunca es el único acceso al dato.
  function tablaDe(cfg) {
    var env = document.createElement('div');
    env.className = 'tabla-env';
    var t = document.createElement('table');
    var series = cfg.series || [];
    var hr = document.createElement('tr');
    ['Fecha', 'Semana'].concat(series.map(function (s) { return (s.corto || s.nombre) + (cfg.unidad ? ' (' + cfg.unidad + ')' : ''); })).forEach(function (n, i) {
      var th = document.createElement('th'); th.textContent = n; if (i) th.className = 'n'; hr.appendChild(th);
    });
    var cab = document.createElement('thead'); cab.appendChild(hr); t.appendChild(cab);
    var dias = {};
    for (var d = 0; d <= cfg.xMax; d += (cfg.xMax > 300 ? 28 : 14)) dias[d] = true;
    series.forEach(function (s) { if (s.puntos) s.x.forEach(function (x) { dias[x] = true; }); });
    var cuerpo = document.createElement('tbody');
    Object.keys(dias).map(Number).sort(function (a, b) { return a - b; }).forEach(function (dia) {
      var tr = document.createElement('tr');
      var a = document.createElement('td'); a.textContent = fechaDe(dia, true); tr.appendChild(a);
      var b = document.createElement('td'); b.className = 'n'; b.textContent = (dia / 7).toFixed(1); tr.appendChild(b);
      series.forEach(function (s) {
        var v = null;
        if (s.puntos) { var i = s.x.indexOf(dia); if (i >= 0) v = s.y[i]; } else v = interpolar(s.x, s.y, dia);
        var c = document.createElement('td'); c.className = 'n';
        c.textContent = v === null ? '—' : (cfg.miles ? Math.round(v).toLocaleString('es-MX') : numero(v, cfg.decimales === undefined ? 1 : cfg.decimales));
        tr.appendChild(c);
      });
      cuerpo.appendChild(tr);
    });
    t.appendChild(cuerpo); env.appendChild(t);
    return env;
  }

  function linea(nombre, corto, color, y, extra) {
    var s = { nombre: nombre, corto: corto, color: color, x: D.dias.slice(0, y.length), y: y };
    for (var k in (extra || {})) s[k] = extra[k];
    return s;
  }
  function banda(nombre, color, opacidad, lo, hi) {
    return { nombre: nombre, color: color, opacidad: opacidad, x: D.dias.slice(0, lo.length), lo: lo, hi: hi };
  }

  var ROJO = '#F40000', NEGRO = '#000000', AZUL = '#0B57A4', GRIS = '#8C8C8C', AMBAR = '#A87400', MORADO = '#7A3E9D';
  var hayDatos = D.obs.x.length > 0;
  var pesajes = { nombre: 'Pesajes medidos', corto: 'Pesaje', color: ROJO, x: D.obs.x, y: D.obs.y, puntos: true };

  var seriesP = [linea('Plan inicial fijo (Hall 2011)', 'Plan fijo', NEGRO, D.plan)];
  var bandasP = [banda('Compensación habitual del 12-44 %', GRIS, .18, D.comp_bajo, D.comp_alto)];
  var marcas = [{ x: D.dias_plan, y: D.meta, color: NEGRO, texto: 'Plan: ' + fechaDe(D.dias_plan, true) }];
  if (hayDatos) {
    seriesP.push(linea('Predicción con tus datos', 'Con tus datos', ROJO, D.datos, { corte: D.t_ultimo }));
    seriesP.push(pesajes);
    bandasP.push(banda('IC 95 % de la predicción', ROJO, .10, D.datos_lo, D.datos_hi));
    if (D.dias_meta_datos !== null && D.dias_meta_datos <= D.x_max) marcas.push({ x: D.dias_meta_datos, y: D.meta, color: ROJO, texto: 'Con tus datos: ' + fechaDe(D.dias_meta_datos, true) });
  }
  marcas.sort(function (a, b) { return a.x - b.x; });
  grafica('g-principal', {
    xMax: D.x_max, series: seriesP, bandas: bandasP, marcas: marcas, unidad: 'kg', alto: 420, altoMovil: 320, espacioAbajo: 2.2,
    refs: [{ y: D.meta, texto: 'Meta: ' + numero(D.meta, 1) + ' kg' }],
    descripcion: 'Peso corporal contra tiempo: plan fijo, pesajes medidos y predicción con los datos. Usa las flechas para recorrer las semanas.'
  });

  if (hayDatos) {
    grafica('g-desviacion', {
      xMax: D.x_max, unidad: 'kg', signo: true, alto: 190, altoMovil: 170, simetrico: true, holguraMin: .5,
      refs: [{ y: 0, color: '#000' }],
      series: [{ nombre: 'Medido menos plan', corto: 'Desviación', color: ROJO, x: D.obs.x, y: D.obs.desv, puntos: true, tallos: true, sinLeyenda: true }],
      descripcion: 'Diferencia en kilogramos entre cada pesaje y la predicción fija.'
    });
    if (D.recta) {
      grafica('g-tendencia', {
        xMax: D.recta.x_fin, unidad: 'kg', alto: 320, altoMovil: 270, espacioAbajo: 1.2,
        refs: [{ y: D.meta, texto: 'Meta: ' + numero(D.meta, 1) + ' kg' }],
        series: [{ nombre: 'Tendencia lineal', corto: 'Tendencia', color: AZUL, x: [0, D.recta.x_fin], y: [D.recta.y_ini, D.recta.y_fin], guion: true }, pesajes],
        descripcion: 'Pesajes medidos y su recta de tendencia.'
      });
    }
  } else {
    document.getElementById('bloque-desviacion').hidden = true;
  }

  var seriesM = [
    linea('Hall dinámico', 'Hall dinámico', NEGRO, D.modelos.hall, { ancho: 2.5 }),
    linea('Hall linealizado', 'Hall lineal', GRIS, D.modelos.lineal),
    linea('Thomas 2011', 'Thomas', AZUL, D.modelos.thomas),
    linea('Regla de 7700 kcal/kg', '7700 kcal/kg', AMBAR, D.modelos.estatico),
    linea('Hall + apetito sin control', 'Apetito', MORADO, D.modelos.apetito)
  ];
  if (hayDatos) seriesM.push(pesajes);
  grafica('g-modelos', {
    xMax: D.x_modelos, series: seriesM, unidad: 'kg', alto: 430, altoMovil: 330, etiquetasFinales: true,
    refs: [{ y: D.meta, texto: 'Meta: ' + numero(D.meta, 1) + ' kg' }],
    descripcion: 'Trayectoria de peso con la misma ingesta según cinco modelos.'
  });
  grafica('g-energia', {
    xMax: D.dias_plan, unidad: 'kcal/d', miles: true, alto: 310, altoMovil: 270, holguraMin: 40,
    refs: [{ y: D.mantenimiento, texto: 'Mantenimiento inicial' }],
    bandas: [banda('Déficit real', GRIS, .18, D.ingesta_plan_serie, D.gasto)],
    series: [linea('Gasto energético (promedio semanal)', 'Gasto', AZUL, D.gasto), linea('Ingesta del plan', 'Ingesta', NEGRO, D.ingesta_plan_serie)],
    descripcion: 'Ingesta constante del plan y gasto energético que baja con el peso.'
  });
  grafica('g-composicion', {
    xMax: D.dias_plan, unidad: 'kg', alto: 310, altoMovil: 270, holguraMin: .3, refs: [{ y: 0, color: '#000' }],
    series: [linea('Grasa', 'Grasa', AZUL, D.delta_grasa), linea('Tejido magro', 'Magro', GRIS, D.delta_magra), linea('Agua y glucógeno', 'Agua y glucógeno', AMBAR, D.delta_agua)],
    descripcion: 'Cambio de grasa, tejido magro, agua y glucógeno respecto al inicio.'
  });

  // Pestaña activa según la sección visible.
  var enlaces = Array.prototype.slice.call(document.querySelectorAll('.pestanas a'));
  if (window.IntersectionObserver) {
    var obs = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) {
        if (!e.isIntersecting) return;
        enlaces.forEach(function (a) {
          var activa = a.getAttribute('href') === '#' + e.target.id;
          a.classList.toggle('activa', activa);
          if (activa) a.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        });
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('main section').forEach(function (s) { obs.observe(s); });
  }
}

(function () {
  'use strict';
  var sobre = JSON.parse(document.getElementById('sobre').textContent);
  var acceso = document.getElementById('acceso');
  var contenido = document.getElementById('contenido');
  var form = document.getElementById('form-acceso');
  var campo = document.getElementById('contrasena');
  var boton = document.getElementById('entrar');
  var estado = document.getElementById('estado-acceso');

  function avisar(texto, esError) {
    estado.textContent = texto;
    estado.classList.toggle('error', !!esError);
  }
  function bytes(b64) {
    var bin = atob(b64), salida = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) salida[i] = bin.charCodeAt(i);
    return salida;
  }
  function normalizar(texto) { return texto.toUpperCase().replace(/[^0-9A-Z]/g, ''); }

  async function abrir(contrasena) {
    var sutil = crypto.subtle;
    var base = await sutil.importKey('raw', new TextEncoder().encode(contrasena), 'PBKDF2', false, ['deriveKey']);
    var llave = await sutil.deriveKey(
      { name: 'PBKDF2', salt: bytes(sobre.sal), iterations: sobre.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var comprimido = await sutil.decrypt({ name: 'AES-GCM', iv: bytes(sobre.iv) }, llave, bytes(sobre.datos));
    var flujo = new Blob([comprimido]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(flujo).text());
  }

  if (!(window.crypto && crypto.subtle && window.DecompressionStream)) {
    avisar('Este navegador no puede abrir la página. Actualízalo o usa otro.', true);
    boton.disabled = true;
    return;
  }
  document.getElementById('mostrar').addEventListener('change', function (e) {
    campo.type = e.target.checked ? 'text' : 'password';
  });
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var contrasena = normalizar(campo.value);
    if (!contrasena) { avisar('Escribe la contraseña.', true); campo.focus(); return; }
    boton.disabled = true;
    avisar('Abriendo...');
    try {
      var reporte = await abrir(contrasena);
      acceso.hidden = true;
      contenido.innerHTML = reporte.html;
      contenido.hidden = false;
      document.title = 'Gestión de peso';
      campo.value = '';
      window.scrollTo(0, 0);
      contenido.focus({ preventScroll: true });
      mostrarReporte(reporte.datos);
    } catch (error) {
      // AES-GCM rechaza una contraseña equivocada con OperationError.
      avisar(error && error.name === 'OperationError'
        ? 'Contraseña incorrecta. Usa la del último mensaje del bot. Si ya es esa, recarga la página: la nueva versión puede tardar unos minutos en aparecer.'
        : 'No se pudo abrir la página. Recárgala e inténtalo de nuevo.', true);
      boton.disabled = false;
      campo.focus();
      campo.select();
    }
  });
  campo.focus();
})();
</script>
